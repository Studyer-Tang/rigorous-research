name: browser

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build deterministic PaperTrail experiment
        run: |
          python -m pip install .
          rigorous-research papertrail \
            --output-dir build/papertrail-e2e \
            --demo-report examples/papertrail-cartea/report.md \
            --demo-manifest examples/papertrail-cartea/evidence.json
      - name: Install pinned browser runner
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser acceptance test
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
