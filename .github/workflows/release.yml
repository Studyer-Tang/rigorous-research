name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$VERSION" = "${GITHUB_REF_NAME}"
      - name: Test and build release artifacts
        run: |
          python -m pip install -e ".[math,dev,agent]"
          python -m unittest discover -s tests -v
          python scripts/skill_quality.py
          python scripts/research_eval.py
          python -m build
          python scripts/build_plugin.py --output build/codex/rigorous-research --archive dist/rigorous-research-agent-plugin
      - name: Generate dependency SBOM
        run: |
          python -m pip install cyclonedx-bom
          python -m venv build/runtime
          build/runtime/bin/python -m pip install ".[math,agent]"
          build/runtime/bin/python -m pip freeze --exclude rigorous-research > dist/runtime-requirements.txt
          cyclonedx-py requirements dist/runtime-requirements.txt \
            --pyproject pyproject.toml \
            --output-reproducible \
            --output-format JSON \
            --output-file dist/sbom.cdx.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
