name: Bug report
description: Report reproducible incorrect behavior in a tool, validator, or example.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the command, exit code, and sanitized output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain which documented contract or release gate should apply.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.2.0 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      options: [Mathematics, Statistics, Finance, Literature, Governance, Packaging]
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, personal information, private data, and proprietary artifacts.
          required: true
