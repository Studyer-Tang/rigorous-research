<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rigorous Research · 研究工作台</title>
<style nonce="__SESSION_TOKEN__">
:root{font-family:system-ui,sans-serif;color:#182b32;background:#f3f5f2}*{box-sizing:border-box}body{max-width:1200px;margin:auto;padding:36px 24px}header{border-bottom:1px solid #cbd5cf;padding-bottom:24px;margin-bottom:24px}h1{font-size:30px;margin:8px 0}h2{font-size:18px}p{line-height:1.65}.eyebrow{color:#41695b;letter-spacing:.12em;font-size:12px}main{display:grid;grid-template-columns:280px 1fr;gap:24px}section,article{background:white;border:1px solid #dce3dd;border-radius:12px;padding:20px;margin-bottom:16px}label{display:block;font-size:13px;margin:14px 0 5px}input,textarea,select{width:100%;border:1px solid #bacac1;border-radius:6px;padding:10px;font:inherit}textarea{min-height:100px}button,a.button{border:1px solid #517261;background:#244f40;color:white;border-radius:6px;padding:9px 13px;cursor:pointer;text-decoration:none;font:inherit;display:inline-block;margin:8px 6px 0 0}button:disabled{opacity:.45;cursor:default}.secondary{background:white;color:#244f40}.muted{color:#5b6c67;font-size:13px}.status{display:flex;gap:12px;flex-wrap:wrap}.status div{background:#edf3ef;padding:12px;flex:1;min-width:135px}.status b{display:block;margin-top:7px;font-size:13px}.action{border-top:1px solid #dde5df;padding:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:360px;overflow:auto}#message{color:#913b22;min-height:22px}#objective{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#244f40}@media(max-width:760px){main{grid-template-columns:1fr}body{padding:20px 14px}}
</style>
<header><div class="eyebrow">RIGOROUS RESEARCH / LOCAL WORKBENCH</div><h1>让研究过程可以追溯</h1><p class="muted">数学证明 · 统计推断 · 持续研究。工具结果、论证草稿与原始目标分别记录。</p></header>
<p id="message" role="status" aria-live="polite"></p>
<main><aside><section><h2>研究项目 / Studies</h2><label for="studies">选择项目</label><select id="studies"><option value="">请选择</option></select><button id="refresh" class="secondary">刷新</button></section>
<section><h2>新建研究</h2><form id="create"><label for="slug">项目标识（英文小写与连字符）</label><input id="slug" pattern="[a-z0-9][a-z0-9-]{0,79}" required><label for="domain">研究领域</label><select id="domain"><option value="mathematics">数学 / Mathematics</option><option value="statistics">统计 / Statistics</option></select><label for="question">原始研究目标</label><textarea id="question" required maxlength="12000"></textarea><button>创建项目</button></form></section></aside>
<div><section><h2 id="title">研究记录 / Research ledger</h2><p id="objective">创建或选择一个研究项目。</p><div class="status" id="status"></div><p id="mode" class="muted"></p><button id="run" disabled>运行 12 步</button><button id="pause" class="secondary" disabled>暂停</button><button id="resume" class="secondary" disabled>恢复</button><a id="export" class="button secondary" hidden>导出记录</a><p class="muted">暂停在步骤之间生效。完成报告不会自动认定命题成立；原始目标需要经过证明与审核。</p></section>
<section><h2>数据 / Data</h2><p class="muted">导入 JSON 数值数组用于统计分析；数据在本地按内容哈希保存。</p><label for="data">数值数组文件</label><input type="file" id="data" accept="application/json,.json"><button id="upload" class="secondary">导入数据</button><pre id="assets"></pre></section>
<section><h2>研究步骤 / Actions</h2><div id="actions"><p class="muted">尚无执行记录。</p></div><details><summary>运行事件与待处理信息</summary><pre id="events"></pre></details></section></div></main>
<script nonce="__SESSION_TOKEN__">
const token='__SESSION_TOKEN__'; const $=id=>document.getElementById(id);let selected='',enabled=false;
async function api(path,data){const response=await fetch(path,data?{method:'POST',headers:{'Content-Type':'application/json','X-Research-Token':token},body:JSON.stringify(data)}:{});const value=await response.json();if(!response.ok)throw Error(value.error||'请求失败');return value;}
async function safe(fn){try{$('message').textContent='';await fn();}catch(error){$('message').textContent=error.message;}}
async function refresh(){const list=await api('/api/studies');enabled=list.api_enabled;$('studies').replaceChildren(new Option('请选择',''),...list.studies.map(x=>new Option(x,x)));$('studies').value=selected;$('mode').textContent=enabled?'API 运行模式：每次最多 12 步、600 秒。':'Codex 模式：通过 MCP 或命令行提交研究步骤；API 自主运行尚未配置。';if(selected)await render();}
async function render(){const c=await api('/api/context?study='+encodeURIComponent(selected)),s=c.state;$('title').textContent=selected;$('objective').textContent=s.objective;$('status').replaceChildren();for(const [label,value] of [['执行状态',s.execution],['原始目标',s.objective_status],['机器子目标',s.machine_contract_status],['停止原因',s.stop_reason||'—']]){const box=document.createElement('div');box.textContent=label;const b=document.createElement('b');b.textContent=value;box.append(b);$('status').append(box);}$('run').disabled=!enabled||s.paused||['DELIVERED','NEEDS_INPUT'].includes(s.execution);$('pause').disabled=s.paused;$('resume').disabled=!s.paused;$('export').hidden=false;$('export').href='/api/export?study='+encodeURIComponent(selected);$('export').download=selected+'.json';$('assets').textContent=JSON.stringify(c.assets,null,2);$('events').textContent=JSON.stringify(c.recent_events,null,2);const expanded=new Set([...$('actions').querySelectorAll('details[open]')].map(d=>d.dataset.action));$('actions').replaceChildren();for(const row of [...c.recent_actions].reverse()){const box=document.createElement('div');box.className='action';const title=document.createElement('b');title.textContent=`#${row.id} · ${row.proposal.action.tool} · ${row.execution}`;const p=document.createElement('p');p.textContent=row.proposal.rationale;const detail=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');detail.dataset.action=String(row.id);detail.open=expanded.has(String(row.id));summary.textContent='查看提案与证据';pre.textContent=JSON.stringify(row,null,2);detail.append(summary,pre);box.append(title,p,detail);$('actions').append(box);}}
$('studies').onchange=()=>safe(async()=>{selected=$('studies').value;if(selected)await render();});$('refresh').onclick=()=>safe(refresh);
$('create').onsubmit=e=>{e.preventDefault();safe(async()=>{await api('/api/create',{study:$('slug').value,objective:$('question').value,domain:$('domain').value});selected=$('slug').value;await refresh();});};
for(const [id,path,extra] of [['run','run',{}],['pause','pause',{paused:true}],['resume','pause',{paused:false}]])$(id).onclick=()=>safe(async()=>{await api('/api/'+path,{study:selected,...extra});await render();});
$('upload').onclick=()=>safe(async()=>{if(!selected||!$('data').files[0])throw Error('请先选择项目和数据文件');const file=$('data').files[0];if(file.size>1000000)throw Error('文件不能超过 1 MB');await api('/api/asset',{study:selected,label:file.name,values:JSON.parse(await file.text())});await render();});
safe(refresh);setInterval(()=>{if(selected&&!document.hidden)safe(render);},5000);
</script></html>
